[project]
name = "ai-usage-widget"
version = "0.1.0"
description = "Claude Code, Codex, and Grok subscription usage for KDE Plasma and the macOS menu bar"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
ai-usage = "ai_usage.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_usage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
