name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python helpers (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, and the version this is developed against.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e './ai-usage[dev]' -e './device-battery[dev]'

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Test ai-usage
        working-directory: ai-usage
        run: pytest

      - name: Test device-battery
        working-directory: device-battery
        run: pytest

  plasmoids:
    name: Plasmoids
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test widget logic
        run: node --test ai-usage/tests/*.cjs device-battery/tests/*.cjs system-stats/tests/*.cjs

      - name: Validate applet packages
        run: |
          set -eu
          ids=""
          for widget in ai-usage device-battery system-stats; do
            dir="$widget/plasmoid"
            for required in metadata.json contents/ui/main.qml contents/ui/CompactRepresentation.qml \
                contents/ui/FullRepresentation.qml contents/ui/configGeneral.qml \
                contents/config/main.xml contents/config/config.qml; do
              test -f "$dir/$required" || { echo "missing $dir/$required"; exit 1; }
            done
            id=$(python3 -c "import json,sys; m = json.load(open(sys.argv[1])); assert m['KPackageStructure'] == 'Plasma/Applet'; print(m['KPlugin']['Id'])" "$dir/metadata.json")
            case " $ids " in *" $id "*) echo "duplicate applet id $id"; exit 1 ;; esac
            ids="$ids $id"
          done

      - name: Check config keys are backed by main.xml
        run: |
          set -eu
          missing=0
          for widget in ai-usage device-battery system-stats; do
            dir="$widget/plasmoid/contents"
            for key in $(grep -rohP 'Plasmoid\.configuration\.\K\w+' "$dir/ui" | sort -u) \
                       $(grep -rohP 'property (alias|string|int|bool|var) cfg_\K\w+' "$dir/ui" | sort -u); do
              grep -q "name=\"$key\"" "$dir/config/main.xml" || { echo "$widget: config key not declared: $key"; missing=1; }
            done
          done
          exit $missing

      - name: Lint QML
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
          qmllint=$(command -v qmllint || echo /usr/lib/qt6/bin/qmllint)
          # Plasma and Kirigami modules are not available on the runner, so unresolved
          # imports are expected. Fail only on syntax errors.
          status=0
          for file in $(find */plasmoid -name '*.qml'); do
            output=$("$qmllint" --bare "$file" 2>&1) || true
            if echo "$output" | grep -qE 'Syntax error|Expected token'; then
              echo "$output"
              status=1
            fi
          done
          exit $status

  macos:
    name: macOS menu bar (ai-usage)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ai-usage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build native app
        run: python3 scripts/build-macos.py
      - name: Verify signature and bundle
        run: |
          codesign --verify --strict "build/AI Usage.app"
          test -f "build/AI Usage.app/Contents/Resources/helper/ai_usage/cli.py"
      - name: Test usage contract and helper bridge
        run: ./scripts/test-macos.sh
      - name: Test shared helper on macOS
        run: |
          pip install -e '.[dev]'
          pytest
