[project]
name = "device-battery"
version = "0.1.0"
description = "Battery levels for wireless headsets, mice, and Bluetooth devices in the KDE Plasma panel"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
device-battery = "device_battery.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/device_battery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
